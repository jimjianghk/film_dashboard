name: Update film data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Fetch and parse spreadsheet
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: npm run update-data

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DEFAULT_YEAR=$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('data/manifest.json')); console.log(m.defaultYear)")
          DATA_FILE=$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('data/manifest.json')); console.log(m.years[m.defaultYear])")
          FILM_COUNT=$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('data/manifest.json')); const d=JSON.parse(fs.readFileSync(m.years[m.defaultYear])); console.log(d.films.length)")
          git add data
          git commit -m "Update ${DEFAULT_YEAR} film data" -m "Refresh ${DATA_FILE} from the source spreadsheet and update the dashboard data manifest. This keeps archived year files stable while the default year follows the latest available sheet." -m "Film count: ${FILM_COUNT}"
          git push
